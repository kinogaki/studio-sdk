[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# The SDK depends on the standard library and the few crates.io crates
# README "Self-contained" lists, at exact versions.
[workspace.dependencies]
kinogaki-studio-api = { path = "crates/api" }
kinogaki-studio-ui-api = { path = "crates/ui-api" }
kinogaki-render-api = { path = "crates/render-api" }
kinogaki-viewport-api = { path = "crates/viewport-api" }
kinogaki-geometry = { path = "crates/geometry" }
kinogaki-edit = { path = "crates/edit" }
kinogaki-studio-api-testing = { path = "crates/api-testing" }
kinogaki-studio-ui-api-testing = { path = "crates/ui-api-testing" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
overflow-checks = true
