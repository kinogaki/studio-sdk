[package]
name = "kinogaki-viewport-api"
description = "The viewport packet contract: surface packets and their columns, line and point classes, face looks, element selections, live preview patches, overlay and guide layers, sparse draw updates and derived shading plans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `Pod` on the records a renderer uploads as bytes (`Vertex`,
# `OverlayVertex`, `OverlayLine`).
bytemuck = ["dep:bytemuck"]

[dependencies]
# Byte casts for GPU uploads, from crates.io at an exact version.
bytemuck = { version = "=1.25.2", features = ["derive"], optional = true }
