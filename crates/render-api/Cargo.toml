[package]
name = "kinogaki-render-api"
description = "The engine-neutral render interface: prims, declared prim types, dirty bits, coalesced scene updates, material networks, settings, outputs, the triangle source contract and the RenderEngine trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The display contract between a wgpu host and its engines (`display`).
wgpu = ["dep:wgpu"]

[dependencies]
# The host's GPU API, from crates.io at the exact version hosts and engines
# share (a host and its engines must agree on it).
wgpu = { version = "=30.0.1", optional = true }
