[package]
name = "kinogaki-studio-ui-api"
description = "Kinogaki Studio's UI layer for plugins: geometry, colors, the theme, input, a painter and immediate widgets, property sheets, cards and the pure parts of value fields, gizmos and point labels. The host draws; plugins never see its UI toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "studio_ui_api"

[lints]
workspace = true

[dependencies]
kinogaki-studio-api.workspace = true
# The viewport packet contract: what a context's views draw of its own.
kinogaki-viewport-api.workspace = true

[features]
# The headless fakes a package's tests drive its UI with (`testing`:
# FakeHost, RecordingUi) and the API's conformance suite. Off by default:
# tests only.
testing = ["kinogaki-studio-api/testing"]

[dev-dependencies]
# The crate's own tests drive it through its fakes.
kinogaki-studio-ui-api = { path = ".", features = ["testing"] }
