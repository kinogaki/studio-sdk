[package]
name = "kinogaki-studio-api"
description = "Kinogaki Studio's headless plugin API: ids, data and data types with their facets, the node cook contract, object kinds, file formats, session slots and the package registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The standard geometry values: the standard data types.
kinogaki-geometry.workspace = true
# The render interface: the triangle source contract data types render through.
kinogaki-render-api.workspace = true
# The viewport packet contract: what data types draw through.
kinogaki-viewport-api.workspace = true

[features]
# Packages' render engines (`Package::engines`): the render interface's
# display contract, which needs wgpu. Off by default: the API stays
# headless for a host that renders nothing.
wgpu = ["kinogaki-render-api/wgpu"]
# The conformance suite (`conformance`): fixtures and invariants a package's
# tests check its data types and engines against. Off by default: tests
# only.
testing = []

[dev-dependencies]
# The crate's own tests use its conformance fixtures.
kinogaki-studio-api = { path = ".", features = ["testing"] }
