[package]
name = "example-box-node"
description = "An example Kinogaki Studio plugin: a Box node and the box data type it makes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# A Rust dylib: Studio and its plugins share one standard library and one
# copy of the SDK.
crate-type = ["dylib"]

[lints]
workspace = true

[dependencies]
kinogaki-studio-api.workspace = true

[dev-dependencies]
# The engines a creation may read (none, in the tests).
kinogaki-render-api.workspace = true
# Its tests add the node to a network on the SDK's fake host.
kinogaki-studio-ui-api.workspace = true
