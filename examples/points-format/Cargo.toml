[package]
name = "example-points-format"
description = "An example Kinogaki Studio file format: XYZ, points, faces over them and the materials they show, read into the standard values and written from them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# A Rust dylib: Studio and its plugins share one standard library and one
# copy of the SDK.
crate-type = ["dylib"]

[lints]
workspace = true

[dependencies]
kinogaki-studio-api.workspace = true
# Material networks, read as MaterialX takes them.
kinogaki-render-api.workspace = true

[dev-dependencies]
# The conformance suite's fixtures, a color service for its reads, and
# scratch folders and round trips.
kinogaki-studio-api-testing.workspace = true
