[package]
name = "example-points-format"
description = "An example Kinogaki Studio file format: XYZ point lists read into the standard geometry and written from it, checked by the SDK's conformance suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# A Rust dylib: Studio and its plugins share one standard library and one
# copy of the SDK.
crate-type = ["dylib"]

[lints]
workspace = true

[dependencies]
kinogaki-studio-api.workspace = true

[dev-dependencies]
# The conformance suite's fixtures, and a color service for its reads.
kinogaki-studio-api-testing.workspace = true
